<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fivefold 5e — Role-Rooted RPG Skill Web Studio</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--background);
      color: var(--foreground);
    }
    #tree-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      user-select: none;
    }
    #tree-svg.panning { cursor: grabbing; }
    #tree-svg.linking { cursor: crosshair; }

    .tier-ring {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.5;
      stroke-dasharray: 6 7;
      opacity: 0.7;
    }
    .tier-ring-label {
      fill: var(--muted-foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      opacity: 0.75;
    }
    .sector-label {
      font-family: Georgia, Cambria, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-anchor: middle;
      opacity: 0.36;
      pointer-events: none;
    }
    .edge-path {
      fill: none;
      stroke: var(--muted-foreground);
      stroke-opacity: 0.38;
      stroke-width: 2;
      transition: stroke 0.15s, stroke-width 0.15s, stroke-opacity 0.15s;
    }
    .edge-path.dimmed { stroke-opacity: 0.1; }
    .edge-path.highlighted { stroke-opacity: 0.95; stroke-width: 3.3; }
    .edge-path.unlocked { stroke-opacity: 0.95; stroke-width: 3.5; }
    .edge-path.editable { cursor: pointer; }
    .edge-path.editable:hover {
      stroke: var(--error) !important;
      stroke-opacity: 1 !important;
      stroke-width: 4.5 !important;
    }
    .node-group { cursor: pointer; transition: opacity 0.18s ease; }
    .node-group.dimmed { opacity: 0.18; }
    .node-group:hover .node-shape { filter: brightness(1.08); }
    .node-label {
      font-size: 12px;
      font-weight: 600;
      fill: var(--foreground);
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: var(--background);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .node-label.root-label {
      font-family: Georgia, Cambria, "Times New Roman", serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .node-glyph {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node-cost-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    @keyframes pulseRing {
      0%, 100% { stroke-opacity: 0.95; }
      50% { stroke-opacity: 0.3; }
    }
    .available-halo {
      fill: none;
      stroke-width: 2.6;
      stroke-dasharray: 5 4;
      animation: pulseRing 2s ease-in-out infinite;
    }
    .toast-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--foreground);
      color: var(--background);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 60;
    }
    .toast-bar.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased">
  <div class="flex flex-col h-screen w-screen overflow-hidden">
    <!-- Top Studio Header -->
    <header class="h-13 shrink-0 flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-[var(--card)] border-b border-[var(--border)] z-20">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-7 h-7 rounded-md bg-[var(--secondary)] border border-[var(--border)] grid place-items-center shrink-0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <polygon points="12,2 21.5,8.9 17.9,20 6.1,20 2.5,8.9" stroke="currentColor" stroke-width="1.8" fill="none" />
            <circle cx="12" cy="2.5" r="2.2" fill="#c93b2b" />
            <circle cx="21" cy="9.2" r="2.2" fill="#c78212" />
            <circle cx="17.6" cy="19.6" r="2.2" fill="#2b5cc7" />
            <circle cx="6.4" cy="19.6" r="2.2" fill="#0d8299" />
            <circle cx="3" cy="9.2" r="2.2" fill="#1b8a5a" />
          </svg>
        </div>
        <h1 class="text-sm font-bold tracking-wide whitespace-nowrap" style="font-family: Georgia, serif;">Fivefold 5e</h1>
        <span id="tree-counts" class="hidden sm:inline-block font-mono text-xs text-[var(--muted-foreground)] px-2 py-0.5 rounded-full bg-[var(--secondary)] border border-[var(--border)]">115 nodes · 153 links</span>
      </div>

      <!-- Mode Switcher -->
      <nav class="inline-flex bg-[var(--secondary)] border border-[var(--border)] rounded-lg p-0.5 gap-0.5" role="tablist">
        <button class="mode-btn px-3 py-1 rounded-md text-xs font-semibold cursor-pointer transition bg-[var(--card)] text-[var(--foreground)] shadow-sm" data-mode="inspect" role="tab" aria-selected="true">Inspect</button>
        <button class="mode-btn px-3 py-1 rounded-md text-xs font-semibold cursor-pointer transition text-[var(--muted-foreground)]" data-mode="build" role="tab" aria-selected="false">Build Character</button>
        <button class="mode-btn px-3 py-1 rounded-md text-xs font-semibold cursor-pointer transition text-[var(--muted-foreground)]" data-mode="edit" role="tab" aria-selected="false">Edit Web</button>
      </nav>

      <!-- Search & I/O -->
      <div class="flex items-center gap-1.5">
        <div class="relative w-44 sm:w-52 search-wrap">
          <input id="search-input" type="text" placeholder="Search 5e feature, skill..." autocomplete="off"
            class="w-full h-8 px-2.5 pr-7 rounded-md border border-[var(--border)] bg-[var(--background)] text-xs text-[var(--foreground)] placeholder:text-[var(--muted-foreground)] outline-none focus:border-[var(--primary)]" />
          <button id="search-clear" class="hidden absolute right-1.5 top-1/2 -translate-y-1/2 text-[var(--muted-foreground)] text-sm px-1 cursor-pointer">&times;</button>
          <div id="search-results" class="hidden absolute top-full mt-1 left-0 right-0 max-h-64 overflow-y-auto bg-[var(--card)] border border-[var(--border)] rounded-lg shadow-lg z-40"></div>
        </div>
        <button id="btn-import" class="h-8 px-2.5 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">Import</button>
        <input id="file-import" type="file" accept=".json,application/json" class="hidden" />
        <button id="btn-export" class="h-8 px-2.5 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">Export</button>
      </div>
    </header>

    <!-- Main Split Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row min-h-0 overflow-hidden">
      <!-- Canvas Area -->
      <section class="flex-1 relative bg-[var(--background)] overflow-hidden min-h-0">
        <!-- Top Floating Filter Bar -->
        <div class="absolute top-2.5 left-2.5 right-2.5 flex flex-wrap items-center justify-between gap-2 pointer-events-none z-10">
          <div id="role-pills" class="flex flex-wrap items-center gap-1 bg-[var(--card)] border border-[var(--border)] rounded-lg p-1 shadow-sm pointer-events-auto"></div>
          <div class="flex items-center gap-1.5 bg-[var(--card)] border border-[var(--border)] rounded-lg p-1 shadow-sm pointer-events-auto">
            <select id="filter-category" class="h-7 px-2 rounded border border-[var(--border)] bg-[var(--background)] text-xs text-[var(--foreground)] outline-none cursor-pointer">
              <option value="all">All Categories</option>
              <option value="root">Role Root</option>
              <option value="class_feature">Class Feature</option>
              <option value="subclass_feature">Subclass Feature</option>
              <option value="feat">Feat</option>
              <option value="spellcasting">Spellcasting</option>
              <option value="hit_die">Hit Die</option>
              <option value="save">Saving Throw</option>
              <option value="skill">Skill</option>
              <option value="proficiency">Proficiency</option>
            </select>
            <select id="filter-tier" class="h-7 px-2 rounded border border-[var(--border)] bg-[var(--background)] text-xs text-[var(--foreground)] outline-none cursor-pointer">
              <option value="all">All Tiers</option>
              <option value="0">Tier 0 (Root)</option>
              <option value="1">Tier I (Lv 1+)</option>
              <option value="2">Tier II (Lv 5+)</option>
              <option value="3">Tier III (Lv 11+)</option>
              <option value="4">Tier IV (Lv 17+)</option>
            </select>
          </div>
        </div>

        <!-- Interactive SVG Canvas -->
        <svg id="tree-svg" viewBox="-1650 -1600 3300 3200">
          <defs>
            <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="var(--muted-foreground)" fill-opacity="0.5"></path>
            </marker>
            <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="currentColor"></path>
            </marker>
          </defs>
          <g id="viewport-group">
            <g id="guides-layer"></g>
            <g id="edges-layer"></g>
            <g id="temp-link-layer"></g>
            <g id="nodes-layer"></g>
          </g>
        </svg>

        <!-- Bottom Floating Controls -->
        <div class="absolute bottom-3 left-3 right-3 flex flex-wrap items-end justify-between gap-2 pointer-events-none z-10">
          <div class="flex items-center gap-1 bg-[var(--card)] border border-[var(--border)] rounded-lg p-1 shadow-sm pointer-events-auto">
            <button id="btn-zoom-out" class="h-7 px-2 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-semibold cursor-pointer">&minus;</button>
            <span id="zoom-readout" class="font-mono text-xs text-[var(--muted-foreground)] min-w-[44px] text-center">100%</span>
            <button id="btn-zoom-in" class="h-7 px-2 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-semibold cursor-pointer">+</button>
            <button id="btn-fit" class="h-7 px-2.5 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">Fit</button>
            <button id="btn-rings" class="h-7 px-2.5 rounded border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium cursor-pointer">Rings</button>
          </div>

          <div id="edit-canvas-tools" class="hidden items-center gap-1 bg-[var(--card)] border border-[var(--border)] rounded-lg p-1 shadow-sm pointer-events-auto">
            <button id="btn-add-node" class="h-7 px-2.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">+ Node</button>
            <button id="btn-link-mode" class="h-7 px-2.5 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">Link Edge</button>
            <button id="btn-auto-layout" class="h-7 px-2.5 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer">Auto-Layout</button>
            <button id="btn-undo" disabled class="h-7 px-2 rounded border border-[var(--border)] bg-[var(--background)] disabled:opacity-40 text-xs font-medium cursor-pointer">Undo</button>
            <button id="btn-redo" disabled class="h-7 px-2 rounded border border-[var(--border)] bg-[var(--background)] disabled:opacity-40 text-xs font-medium cursor-pointer">Redo</button>
          </div>

          <div id="hud-status" class="hidden items-center gap-2 bg-[var(--card)] border border-[var(--primary)] rounded-lg px-3 py-1.5 text-xs shadow-sm pointer-events-auto">
            <span id="hud-status-text" class="font-medium"></span>
            <button id="hud-status-cancel" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--secondary)] text-xs cursor-pointer">Cancel</button>
          </div>
        </div>
      </section>

      <!-- Right Studio Inspector Drawer -->
      <aside class="w-full lg:w-[385px] h-[42vh] lg:h-auto shrink-0 bg-[var(--card)] border-t lg:border-t-0 lg:border-l border-[var(--border)] flex flex-col min-h-0 z-15">
        <div id="build-subtabs" class="hidden border-b border-[var(--border)] px-3 gap-2 shrink-0">
          <button class="sub-tab py-2.5 px-2 text-xs font-semibold border-b-2 border-[var(--primary)] text-[var(--foreground)] cursor-pointer" data-btab="sheet">Character Sheet</button>
          <button class="sub-tab py-2.5 px-2 text-xs font-semibold border-b-2 border-transparent text-[var(--muted-foreground)] cursor-pointer" data-btab="node">Selected Node</button>
        </div>
        <div id="inspector-content" class="flex-1 overflow-y-auto p-3.5 space-y-3"></div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast-bar" role="status" aria-live="polite"></div>

"to":"hybrid_divine_smite"},{"id":"edge_devotion_channel_divinity__hybrid_divine_smite","from":"devotion_channel_divinity","to":"hybrid_divine_smite"},{"id":"edge_hybrid_divine_smite__hybrid_sacred_weapon","from":"hybrid_divine_smite","to":"hybrid_sacred_weapon"},{"id":"edge_combat_extra_attack__hybrid_sacred_weapon","from":"combat_extra_attack","to":"hybrid_sacred_weapon"},{"id":"edge_devotion_channel_divinity__hybrid_divine_magic","from":"devotion_channel_divinity","to":"hybrid_divine_magic"},{"id":"edge_magic_spell_t1__hybrid_divine_magic","from":"magic_spell_t1","to":"hybrid_divine_magic"},{"id":"edge_hybrid_divine_magic__hybrid_radiant_conduit","from":"hybrid_divine_magic","to":"hybrid_radiant_conduit"},{"id":"edge_magic_spell_t2__hybrid_radiant_conduit","from":"magic_spell_t2","to":"hybrid_radiant_conduit"},{"id":"edge_magic_spell_t1__hybrid_magical_secrets","from":"magic_spell_t1","to":"hybrid_magical_secrets"},{"id":"edge_social_bardic_inspiration__hybrid_magical_secrets","from":"social_bardic_inspiration","to":"hybrid_magical_secrets"},{"id":"edge_hybrid_magical_secrets__hybrid_enthralling_weave","from":"hybrid_magical_secrets","to":"hybrid_enthralling_weave"},{"id":"edge_magic_spell_t2__hybrid_enthralling_weave","from":"magic_spell_t2","to":"hybrid_enthralling_weave"},{"id":"edge_social_prof_intrigue_tools__hybrid_master_intrigue","from":"social_prof_intrigue_tools","to":"hybrid_master_intrigue"},{"id":"edge_exploring_expertise__hybrid_master_intrigue","from":"exploring_expertise","to":"hybrid_master_intrigue"},{"id":"edge_hybrid_master_intrigue__hybrid_shadow_network","from":"hybrid_master_intrigue","to":"hybrid_shadow_network"},{"id":"edge_social_silver_tongue__hybrid_shadow_network","from":"social_silver_tongue","to":"hybrid_shadow_network"},{"id":"edge_exploring_prof_light_finesse__hybrid_sneak_attack","from":"exploring_prof_light_finesse","to":"hybrid_sneak_attack"},{"id":"edge_combat_prof_weapons_martial__hybrid_sneak_attack","from":"combat_prof_weap ual_casting","magic_arcane_ward","hybrid_war_magic"]},{"id":"preset_shadow_scout","name":"Lv 5 Shadow Assassin","level":5,"description":"Exploring + Combat skirmisher with Sneak Attack, Cunning Action, Expertise, and Assassinate.","unlocked":["exploring_root","exploring_skill_stealth","exploring_skill_perception","exploring_skill_investigation","exploring_save_dex","exploring_skill_acrobatics","exploring_prof_light_finesse","exploring_expertise","exploring_cunning_action","combat_root","combat_prof_weapons_martial","hybrid_sneak_attack","hybrid_assassinate"]},{"id":"preset_arcane_diplomat","name":"Lv 5 Lore Bard","level":5,"description":"Social + Magic maestro combining Bardic Inspiration, Cutting Words, and Magical Secrets.","unlocked":["social_root","social_skill_performance","social_skill_persuasion","social_save_cha","social_bardic_inspiration","social_jack_of_trades","social_cutting_words","magic_root","magic_spell_t1","magic_spell_t2","hybrid_magical_secrets"]}]};
  </script>
  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'fivefold5e_artifact_web_v1';
      const BUILD_KEY = 'fivefold5e_artifact_build_v1';
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const ALL_ROLES_ORDER = ['combat', 'devotion', 'magic', 'social', 'exploring', 'hybrid'];
      const ALL_SAVES = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
      const SPELL_TIER_LABELS = [
        'None',
        'Tier I (1st–2nd Slots)',
        'Tier II (3rd–5th Slots)',
        'Tier III (6th–7th Slots)',
        'Tier IV — Archmage (8th–9th)',
      ];
      const TIER_ROMAN = ['0', 'I', 'II', 'III', 'IV'];
      const TIER_RADII = [260, 560, 860, 1130, 1360];

      const deepClone = (o) => JSON.parse(JSON.stringify(o));
      const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      function loadSavedTree() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && Array.isArray(p.nodes) && Array.isArray(p.edges)) return p;
          }
        } catch (_) {}
        return deepClone(window.FIVEFOLD_DEFAULT_TREE);
      }
      function saveTree() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (_) {}
      }
      function loadSavedBuild() {
        try {
          const raw = localStorage.getItem(BUILD_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            if (p && typeof p.level === 'number' && Array.isArray(p.unlocked)) {
              return { level: Math.max(1, Math.min(20, p.level)), conMod: typeof p.conMod === 'number' ? p.conMod : 2, unlocked: new Set(p.unlocked) };
            }
          }
        } catch (_) {}
        return { level: 5, conMod: 2, unlocked: new Set() };
      }
      function saveBuild() {
        try {
          localStorage.setItem(BUILD_KEY, JSON.stringify({ level: state.build.level, conMod: state.build.conMod, unlocked: Array.from(state.build.unlocked) }));
        } catch (_) {}
      }

      const state = {
        data: loadSavedTree(),
        mode: 'inspect',
        buildSubTab: 'sheet',
        selectedNodeId: 'combat_root',
        hoveredNodeId: null,
        filterRole: 'all',
        filterCategory: 'all',
        filterTier: 'all',
        searchQuery: '',
        showRings: true,
        view: { tx: 0, ty: 0, scale: 0.9 },
        build: loadSavedBuild(),
        linkMode: false,
        linkSourceId: null,
        cursorWorld: { x: 0, y: 0 },
        undoStack: [],
        redoStack: [],
      };

      const getNode = (id) => state.data.nodes.find((n) => n.id === id) || null;
      const getRoleInfo = (rid) => state.data.roles[rid] || { id: rid, name: rid, color: '#8f6339' };
      const getParents = (nid) => state.data.edges.filter((e) => e.to === nid).map((e) => e.from);
      const getChildren = (nid) => state.data.edges.filter((e) => e.from === nid).map((e) => e.to);

      function wouldCreateCycle(fromId, toId) {
        if (fromId === toId) return true;
        const seen = new Set([toId]);
        const q = [toId];
        while (q.length) {
          const cur = q.shift();
          for (const e of state.data.edges) {
            if (e.from === cur) {
              if (e.to === fromId) return true;
              if (!seen.has(e.to)) { seen.add(e.to); q.push(e.to); }
            }
          }
        }
        return false;
      }

      function pushUndo() {
        state.undoStack.push(deepClone({ nodes: state.data.nodes, edges: state.data.edges }));
        if (state.undoStack.length > 40) state.undoStack.shift();
        state.redoStack = [];
        updateUndoButtons();
      }
      function performUndo() {
        if (!state.undoStack.length) return;
        state.redoStack.push(deepClone({ nodes: state.data.nodes, edges: state.data.edges }));
        const prev = state.undoStack.pop();
        state.data.nodes = prev.nodes;
        state.data.edges = prev.edges;
        pruneInvalidBuildNodes();
        saveTree();
        renderAll();
        showToast('Undid last change');
      }
      function performRedo() {
        if (!state.redoStack.length) return;
        state.undoStack.push(deepClone({ nodes: state.data.nodes, edges: state.data.edges }));
        const next = state.redoStack.pop();
        state.data.nodes = next.nodes;
        state.data.edges = next.edges;
        pruneInvalidBuildNodes();
        saveTree();
        renderAll();
        showToast('Redid change');
      }
      function pruneInvalidBuildNodes() {
        const ids = new Set(state.data.nodes.map((n) => n.id));
        for (const id of Array.from(state.build.unlocked)) if (!ids.has(id)) state.build.unlocked.delete(id);
      }

      // Builder engine
      const getTotalSP = (lv = state.build.level) => state.data.meta.startingPoints + (lv - 1) * state.data.meta.pointsPerLevel;
      const getSpentSP = () => Array.from(state.build.unlocked).reduce((acc, id) => acc + (Number(getNode(id)?.cost) || 0), 0);
      const getRemainingSP = () => getTotalSP() - getSpentSP();
      const getProfBonus = (lv = state.build.level) => 2 + Math.floor((lv - 1) / 4);

      function evaluateNodeBuildStatus(node) {
        if (state.build.unlocked.has(node.id)) return { status: 'unlocked', reasons: [] };
        const reasons = [];
        const minLv = state.data.meta.tierMinLevels[node.tier] ?? 1;
        if (state.build.level < minLv) reasons.push(`Requires Level ${minLv} (Tier ${TIER_ROMAN[node.tier]})`);
        const parents = getParents(node.id);
        if (parents.length) {
          if (node.prereqMode === 'any') {
            if (!parents.some((p) => state.build.unlocked.has(p))) {
              reasons.push(`Requires any parent: ${parents.map((p) => getNode(p)?.name || p).join(' or ')}`);
            }
          } else {
            const miss = parents.filter((p) => !state.build.unlocked.has(p));
            if (miss.length) reasons.push(`Missing prerequisite: ${miss.map((p) => getNode(p)?.name || p).join(', ')}`);
          }
        }
        const rem = getRemainingSP();
        if (node.cost > rem) reasons.push(`Needs ${node.cost} SP (${rem} remaining)`);
        return { status: reasons.length ? 'locked' : 'available', reasons };
      }

      function getBlockingUnlockedChildren(nodeId) {
        const blockers = [];
        for (const cid of getChildren(nodeId)) {
          if (!state.build.unlocked.has(cid)) continue;
          const child = getNode(cid);
          if (!child) continue;
          if (child.prereqMode === 'any') {
            if (!getParents(cid).some((pid) => pid !== nodeId && state.build.unlocked.has(pid))) blockers.push(child);
          } else blockers.push(child);
        }
        return blockers;
      }

      function toggleBuildNode(nodeId, cascade = false) {
        const node = getNode(nodeId);
        if (!node) return;
        if (state.build.unlocked.has(nodeId)) {
          const blockers = getBlockingUnlockedChildren(nodeId);
          if (blockers.length && !cascade) {
            showToast(`Blocked by: ${blockers.map((b) => b.name).join(', ')}. Use Refund Branch in drawer.`);
            state.selectedNodeId = nodeId;
            state.buildSubTab = 'node';
            renderAll();
            return;
          }
          if (cascade) {
            const toRemove = new Set([nodeId]);
            const q = [nodeId];
            while (q.length) {
              const cur = q.shift();
              for (const cid of getChildren(cur)) {
                if (!state.build.unlocked.has(cid) || toRemove.has(cid)) continue;
                const ch = getNode(cid);
                if (ch?.prereqMode === 'any' && getParents(cid).some((p) => !toRemove.has(p) && state.build.unlocked.has(p))) continue;
                toRemove.add(cid);
                q.push(cid);
              }
            }
            for (const id of toRemove) state.build.unlocked.delete(id);
            showToast(`Refunded ${toRemove.size} node(s)`);
          } else {
            state.build.unlocked.delete(nodeId);
            showToast(`Refunded ${node.name} (+${node.cost} SP)`);
          }
          saveBuild();
          renderAll();
          return;
        }
        const ev = evaluateNodeBuildStatus(node);
        if (ev.status !== 'available') {
          showToast(ev.reasons[0]);
          state.selectedNodeId = nodeId;
          state.buildSubTab = 'node';
          renderAll();
          return;
        }
        state.build.unlocked.add(nodeId);
        saveBuild();
        renderAll();
        showToast(`Unlocked ${node.name} (-${node.cost} SP)`);
      }

      function computeCharacterSummary() {
        let hitDie = state.data.meta.baseHitDie || 6;
        let spellTier = 0;
        const saves = new Set(), skills = new Set(), proficiencies = new Set();
        const features = [], feats = [], roots = [];
        for (const id of state.build.unlocked) {
          const n = getNode(id);
          if (!n) continue;
          if (n.grants?.hitDie > hitDie) hitDie = n.grants.hitDie;
          if (n.grants?.spellTier > spellTier) spellTier = n.grants.spellTier;
          (n.grants?.saves || []).forEach((s) => saves.add(s));
          (n.grants?.skills || []).forEach((s) => skills.add(s));
          (n.grants?.proficiencies || []).forEach((p) => proficiencies.add(p));
          if (n.category === 'root') roots.push(n);
          else if (n.category === 'feat') feats.push(n);
          else if (['class_feature', 'subclass_feature', 'spellcasting'].includes(n.category)) features.push(n);
        }
        const lv = state.build.level, con = state.build.conMod;
        const avgHp = Math.max(lv, hitDie + con + (lv - 1) * (Math.floor(hitDie / 2) + 1 + con));
        return {
          level: lv, conMod: con, profBonus: getProfBonus(lv),
          totalSP: getTotalSP(lv), spentSP: getSpentSP(), remainingSP: getRemainingSP(),
          hitDie, avgHp, spellTier, saves,
          skills: Array.from(skills).sort(), proficiencies: Array.from(proficiencies).sort(),
          roots, features, feats,
        };
      }

      // DOM refs
      const svg = document.getElementById('tree-svg');
      const viewportG = document.getElementById('viewport-group');
      const guidesLayer = document.getElementById('guides-layer');
      const edgesLayer = document.getElementById('edges-layer');
      const tempLinkLayer = document.getElementById('temp-link-layer');
      const nodesLayer = document.getElementById('nodes-layer');
      const inspectorContent = document.getElementById('inspector-content');
      const buildSubtabs = document.getElementById('build-subtabs');
      const rolePillsEl = document.getElementById('role-pills');
      const treeCountsEl = document.getElementById('tree-counts');
      const zoomReadoutEl = document.getElementById('zoom-readout');
      const editCanvasToolsEl = document.getElementById('edit-canvas-tools');
      const hudStatusEl = document.getElementById('hud-status');
      const hudStatusTextEl = document.getElementById('hud-status-text');
      const searchInput = document.getElementById('search-input');
      const searchClear = document.getElementById('search-clear');
      const searchResults = document.getElementById('search-results');

      // Viewport helpers
      function applyViewport() {
        viewportG.setAttribute('transform', `translate(${state.view.tx}, ${state.view.ty}) scale(${state.view.scale})`);
        zoomReadoutEl.textContent = `${Math.round(state.view.scale * 100)}%`;
      }
      function screenToWorld(cx, cy) {
        const rect = svg.getBoundingClientRect();
        const vb = svg.viewBox.baseVal;
        const sx = vb.x + ((cx - rect.left) / rect.width) * vb.width;
        const sy = vb.y + ((cy - rect.top) / rect.height) * vb.height;
        return { x: (sx - state.view.tx) / state.view.scale, y: (sy - state.view.ty) / state.view.scale };
      }
      function fitToNodes(list = state.data.nodes, pad = 280) {
        if (!list.length) { state.view = { tx: 0, ty: 0, scale: 0.9 }; applyViewport(); return; }
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const n of list) {
          if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
          if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
        }
        const vb = svg.viewBox.baseVal;
        const w = Math.max(400, maxX - minX + pad * 2);
        const h = Math.max(400, maxY - minY + pad * 2);
        const scale = Math.min(2.2, Math.max(0.35, Math.min(vb.width / w, vb.height / h)));
        state.view = { scale, tx: -((minX + maxX) / 2) * scale, ty: -((minY + maxY) / 2) * scale };
        applyViewport();
      }
      function panToNode(id, targetScale = 1.45) {
        const n = getNode(id);
        if (!n) return;
        state.view.scale = Math.max(state.view.scale, targetScale);
        state.view.tx = -n.x * state.view.scale;
        state.view.ty = -n.y * state.view.scale;
        applyViewport();
      }
      function zoomBy(factor, cx = null, cy = null) {

      // SVG rendering

        }
        if (state.filterCategory !== 'all' && n.category !== state.filterCategory) return false;

          if (!hay.includes(q)) return false;

      }
      function nodeRadius(n) {
        if (n.category === 'root') return 44;
        if (n.category === 'spellcasting' || n.category === 'feat') return 31;

      function renderGuides() {
        guidesLayer.innerHTML = '';

          el('circle', { cx: 0, cy: 0, r, class: 'tier-ring' }, guidesLayer);
          const lbl = el('text', { x: 0, y: -r - 12, class: 'tier-ring-label' }, guidesLayer);
          lbl.textContent = i === 0 ? 'ROOTS' : `TIER ${TIER_ROMAN[i]}`;

      }
      function computeEdgePath(a, b) {

      function renderEdges(matchSet) {

          const isAct = activeId && (edge.from === activeId || edge.to === activeId);
          const isUnl = state.mode === 'build' && state.build.unlocked.has(from.id) && state.build.unlocked.has(to.id);
          let cls = 'edge-path';
          if (!bothMatch && !isAct) cls += ' dimmed';

      function renderNodes(matchSet) {

            <div class="${titleCls}"><span>Prerequisites (${parents.length})</span><span class="normal-case font-normal">${parents.length > 1 ? (n.prereqMode === 'any' ? 'ANY' : 'ALL') : ''}</span></div>
            ${parents.length ? `<div class="flex flex-wrap gap-1.5">${parents.map((p) => `<button class="${chipCls}" data-jump="${p.id}"><span class="w-2 h-2 rounded-full" style="background:${getRoleInfo(p.role).color}"></span>${esc(p.name)}</button>`).join('')}</div>` : `<div class="text-xs text-[var(--muted-foreground)]">Root Gateway</div>`}
          </div>
          <div class="${cardCls}">
            <div class="${titleCls}">Unlocks (${children.length})</div>
            ${children.length ? `<div class="flex flex-wrap gap-1.5">${children.map((c) => `<button class="${chipCls}" data-jump="${c.id}"><span class="w-2 h-2 rounded-full" style="background:${getRoleInfo(c.role).color}"></span>${esc(c.name)}</button>`).join('')}</div>` : `<div class="text-xs text-[var(--muted-foreground)]">Leaf / Capstone Node</div>`}
          </div>
        `;
      }

      function wireJumps() {
        inspectorContent.querySelectorAll('[data-jump]').forEach((b) => {
          b.addEventListener('click', () => {
            state.selectedNodeId = b.dataset.jump;
            panToNode(state.selectedNodeId, Math.max(1.25, state.view.scale));
            renderAll();
          });
        });
      }

      function renderInspector() {
        const isBuild = state.mode === 'build';
        buildSubtabs.classList.toggle('hidden', !isBuild);
        buildSubtabs.classList.toggle('flex', isBuild);
        buildSubtabs.querySelectorAll('.sub-tab').forEach((b) => {
          const act = b.dataset.btab === state.buildSubTab;
          b.className = `sub-tab py-2.5 px-2 text-xs font-semibold border-b-2 cursor-pointer ${act ? 'border-[var(--primary)] text-[var(--foreground)]' : 'border-transparent text-[var(--muted-foreground)]'}`;
        });

        if (state.mode === 'inspect') {
          const n = getNode(state.selectedNodeId);
          if (!n) { inspectorContent.innerHTML = `<div class="text-xs text-[var(--muted-foreground)] text-center py-8">Click any node to inspect its 5e rules.</div>`; return; }
          inspectorContent.innerHTML = `${renderDetailsCards(n)}<div class="flex gap-2">
            <button id="q-build" class="flex-1 py-2 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">Test in Build Mode</button>
            <button id="q-edit" class="flex-1 py-2 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-semibold cursor-pointer">Edit Node</button>
          </div>`;
          wireJumps();
          document.getElementById('q-build').addEventListener('click', () => setMode('build'));
          document.getElementById('q-edit').addEventListener('click', () => setMode('edit'));
        } else if (state.mode === 'build') {
          if (state.buildSubTab === 'node') {

            wireJumps();
            document.getElementById('btn-toggle-unlock')?.addEventListener('click', () => toggleBuildNode(n.id, false));
            document.getElementById('btn-refund-cascade')?.addEventListener('click', () => toggleBuildNode(n.id, true));
          } else {
            const c = computeCharacterSummary();
            const pct = Math.min(100, Math.round((c.spentSP / Math.max(1, c.totalSP)) * 100));
            inspectorContent.innerHTML = `
              <div class="${cardCls} space-y-2.5">
                <div class="${titleCls}"><span>Level &amp; Budget</span><span class="font-mono">Prof +${c.profBonus}</span></div>
                <div class="grid grid-cols-2 gap-2.5 text-xs">
                  <label class="flex flex-col gap-1">Level <strong class="font-mono">${c.level}</strong>
                    <input id="b-lv" type="range" min="1" max="20" value="${c.level}" class="accent-[var(--primary)]" />
                  </label>
                  <label class="flex flex-col gap-1">CON Mod <strong class="font-mono">${c.conMod >= 0 ? '+' : ''}${c.conMod}</strong>
                    <input id="b-con" type="range" min="-1" max="5" value="${c.conMod}" class="accent-[var(--primary)]" />
                  </label>
                </div>
                <div class="flex justify-between text-xs font-semibold">
                  <span>Skill Points: ${c.spentSP} / ${c.totalSP}</span>
                  <span style="color:${c.remainingSP < 0 ? 'var(--error)' : 'var(--success)'}">${c.remainingSP} left</span>
                </div>
                <div class="w-full h-1.5 rounded-full bg-[var(--secondary)] overflow-hidden">
                  <div class="h-full bg-[var(--primary)] transition-all" style="width:${pct}%"></div>
                </div>
                <div class="flex gap-1.5 pt-1">
                  <select id="b-preset" class="${inputCls} flex-1">
                    <option value="">— Load Archetype Preset —</option>
                    ${(state.data.presets || []).map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
                  </select>
                  <button id="b-reset" class="px-2.5 rounded-md border border-[var(--error)] text-[var(--error)] text-xs font-semibold cursor-pointer">Reset</button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div class="${cardCls}"><div class="text-xs text-[var(--muted-foreground)]">Hit Die / Avg HP</div><div class="font-mono text-base font-bold mt-0.5">d${c.hitDie} · ${c.avgHp} HP</div></div>
                <div class="${cardCls}"><div class="text-xs text-[var(--muted-foreground)]">Spellcasting</div><div class="font-mono text-sm font-bold mt-1">${c.spellTier ? `Tier ${TIER_ROMAN[c.spellTier]}` : 'None'}</div></div>
              </div>

              <div class="${cardCls}">
                <div class="${titleCls}">Saving Throws</div>
                <div class="grid grid-cols-6 gap-1">
                  ${ALL_SAVES.map((s) => `<div class="text-center py-1 rounded font-mono text-xs font-bold border ${c.saves.has(s) ? 'bg-[var(--success)] border-[var(--success)] text-white' : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)]'}">${s}</div>`).join('')}
                </div>
              </div>

              <div class="${cardCls}">
                <div class="${titleCls}">Skills (${c.skills.length} / 18)</div>
                ${c.skills.length ? `<div class="flex flex-wrap gap-1">${c.skills.map((s) => `<span class="${badgeCls}">${esc(s)}</span>`).join('')}</div>` : `<div class="text-xs text-[var(--muted-foreground)]">Click Skill nodes on the canvas to unlock.</div>`}
              </div>

              <div class="${cardCls}">
                <div class="${titleCls}">Proficiencies (${c.proficiencies.length})</div>
                ${c.proficiencies.length ? `<div class="flex flex-wrap gap-1">${c.proficiencies.map((p) => `<span class="${badgeCls}">${esc(p)}</span>`).join('')}</div>` : `<div class="text-xs text-[var(--muted-foreground)]">None yet.</div>`}
              </div>

              <div class="${cardCls}">
                <div class="${titleCls}">Unlocked Features &amp; Feats (${c.features.length + c.feats.length})</div>
                ${(c.features.length + c.feats.length)
                  ? `<div class="flex flex-wrap gap-1.5">${[...c.features, ...c.feats].map((f) => `<button class="${chipCls}" data-jump="${f.id}"><span class="w-2 h-2 rounded-full" style="background:${getRoleInfo(f.role).color}"></span>${esc(f.name)}</button>`).join('')}</div>`

              <button id="b-export-md" class="w-full py-2 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">Export Character Sheet (.md)</button>
            `;
            wireJumps();
            document.getElementById('b-lv').addEventListener('input', (e) => { state.build.level = Number(e.target.value); saveBuild(); renderAll(); });
            document.getElementById('b-con').addEventListener('input', (e) => { state.build.conMod = Number(e.target.value); saveBuild(); renderInspector(); });
            document.getElementById('b-preset').addEventListener('change', (e) => {
              const p = (state.data.presets || []).find((x) => x.id === e.target.value);
              if (!p) return;
              state.build.level = p.level;
              state.build.unlocked = new Set(p.unlocked.filter((id) => Boolean(getNode(id))));
              saveBuild(); renderAll(); showToast(`Loaded ${p.name}`);

            document.getElementById('b-reset').addEventListener('click', () => { state.build.unlocked.clear(); saveBuild(); renderAll(); showToast('Build reset'); });

              const md = [
                `# Fivefold 5e Character (Level ${c.level})`, '',
                `- **Hit Die:** d${c.hitDie} (Avg HP: ${c.avgHp})`,
                `- **Proficiency Bonus:** +${c.profBonus}`,
                `- **Skill Points:** ${c.spentSP} / ${c.totalSP}`,
                `- **Spellcasting:** ${SPELL_TIER_LABELS[c.spellTier]}`,
                `- **Saves:** ${ALL_SAVES.filter((s) => c.saves.has(s)).join(', ') || 'None'}`,
                `- **Skills:** ${c.skills.join(', ') || 'None'}`,
                `- **Proficiencies:** ${c.proficiencies.join(', ') || 'None'}`, '',
                '## Features & Feats',
                ...[...c.features, ...c.feats].map((f) => `- **${f.name}** (*${f.source5e}*): ${f.summary}`),
              ].join('\n');
              downloadText(`fivefold5e-lv${c.level}.md`, md, 'text/markdown');
              showToast('Exported Character Sheet');
            });
          }
        } else {
          renderEditPanel();
        }
      }

      function createNewNode({ x, y, parentId = null } = {}) {
        pushUndo();
        const parent = parentId ? getNode(parentId) : null;
        let nx = x, ny = y;
        if (nx === undefined || ny === undefined) {
          if (parent) {
            const ang = Math.atan2(parent.y, parent.x) + 0.08;
            const r = Math.hypot(parent.x, parent.y) + 175;
            nx = Math.round(Math.cos(ang) * r); ny = Math.round(Math.sin(ang) * r);
          } else { nx = 0; ny = 0; }
        }
        const id = `custom_${Date.now().toString(36)}`;
        const tier = parent ? Math.min(4, parent.tier + 1) : 1;
        state.data.nodes.push({
          id, name: 'New Feature', role: parent ? parent.role : 'combat',
          secondaryRoles: parent?.role === 'hybrid' ? ['combat', 'magic'] : [],
          category: 'class_feature', tier, cost: Math.max(1, tier), prereqMode: 'all',
          x: nx, y: ny, source5e: 'Homebrew / Custom',
          summary: 'Short summary of what this node grants.',
          mechanics: 'Full 5e mechanics and scaling.',
          grants: { hitDie: null, saves: [], skills: [], proficiencies: [], spellTier: 0, tags: [] },
        });
        if (parent) state.data.edges.push({ id: `edge_${parent.id}__${id}`, from: parent.id, to: id });
        state.selectedNodeId = id;
        saveTree(); renderAll(); panToNode(id, Math.max(1.1, state.view.scale));
        showToast(parent ? `Added child under ${parent.name}` : 'Created new node');
      }

      function renderEditPanel() {
        const n = getNode(state.selectedNodeId);
        if (!n) {
          inspectorContent.innerHTML = `<div class="${cardCls} space-y-2 text-xs">
            <div class="${titleCls}">Web Editor</div>
            <p class="text-[var(--muted-foreground)]">Select a node to edit, drag to move, double-click canvas to add, or click any edge to unlink.</p>
            <div class="flex gap-2">
              <button id="e-add" class="flex-1 py-1.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold cursor-pointer">+ Add Node</button>
              <button id="e-reset" class="px-3 py-1.5 rounded border border-[var(--error)] text-[var(--error)] font-semibold cursor-pointer">Reset SRD</button>
            </div>
          </div>`;
          document.getElementById('e-add').addEventListener('click', () => createNewNode({ x: 0, y: 0 }));
          document.getElementById('e-reset').addEventListener('click', resetDefaultTree);
          return;
        }
        const parents = getParents(n.id).map(getNode).filter(Boolean);
        const children = getChildren(n.id).map(getNode).filter(Boolean);
        const pSet = new Set(parents.map((p) => p.id));
        const cands = state.data.nodes.filter((c) => c.id !== n.id && !pSet.has(c.id) && !wouldCreateCycle(c.id, n.id)).sort((a, b) => a.name.localeCompare(b.name));

        inspectorContent.innerHTML = `
          <div class="${cardCls} space-y-2">
            <div class="flex gap-1.5">
              <button id="e-child" class="flex-1 py-1.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">+ Add Child</button>
              <button id="e-del" class="px-2.5 py-1.5 rounded border border-[var(--error)] text-[var(--error)] text-xs font-semibold cursor-pointer">Delete</button>
              <button id="e-reset" class="px-2.5 py-1.5 rounded border border-[var(--border)] bg-[var(--card)] text-xs font-medium cursor-pointer">Reset SRD</button>
            </div>
            <div class="text-xs text-[var(--muted-foreground)]">Drag nodes on canvas · Double-click to add · Click any edge to unlink.</div>
          </div>

          <div class="${cardCls} space-y-2 text-xs">
            <div class="${titleCls}">Node Properties</div>
            <label class="block space-y-1">Name <input id="ed-name" class="${inputCls}" value="${esc(n.name)}" /></label>
            <div class="grid grid-cols-2 gap-2">
              <label class="block space-y-1">Role
                <select id="ed-role" class="${inputCls}">
                  ${ALL_ROLES_ORDER.map((r) => `<option value="${r}" ${n.role === r ? 'selected' : ''}>${esc(getRoleInfo(r).name)}</option>`).join('')}
                </select>
              </label>
              <label class="block space-y-1">Category
                <select id="ed-cat" class="${inputCls}">
                  ${Object.values(state.data.categories).map((c) => `<option value="${c.id}" ${n.category === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
                </select>
              </label>
              <label class="block space-y-1">Tier
                <select id="ed-tier" class="${inputCls}">
                  ${[0,1,2,3,4].map((t) => `<option value="${t}" ${n.tier === t ? 'selected' : ''}>Tier ${TIER_ROMAN[t]}</option>`).join('')}
                </select>
              </label>
              <label class="block space-y-1">SP Cost <input id="ed-cost" type="number" min="0" max="20" class="${inputCls}" value="${n.cost}" /></label>
              <label class="block space-y-1">Prereq Mode
                <select id="ed-pm" class="${inputCls}">
                  <option value="all" ${n.prereqMode !== 'any' ? 'selected' : ''}>ALL parents</option>
                  <option value="any" ${n.prereqMode === 'any' ? 'selected' : ''}>ANY parent</option>
                </select>
              </label>
              <label class="block space-y-1">5e Source <input id="ed-src" class="${inputCls}" value="${esc(n.source5e)}" /></label>
            </div>
            ${n.role === 'hybrid' ? `<div class="space-y-1"><div>Hybrid Linked Roles</div><div class="flex flex-wrap gap-1.5">${['combat','devotion','magic','social','exploring'].map((r) => `<label class="inline-flex items-center gap-1 px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer"><input type="checkbox" data-sr="${r}" ${(n.secondaryRoles||[]).includes(r)?'checked':''} />${esc(getRoleInfo(r).name)}</label>`).join('')}</div></div>` : ''}
            <label class="block space-y-1">Summary <input id="ed-sum" class="${inputCls}" value="${esc(n.summary)}" /></label>
            <label class="block space-y-1">Mechanics <textarea id="ed-mech" rows="3" class="${inputCls}">${esc(n.mechanics)}</textarea></label>
          </div>

          <div class="${cardCls} space-y-2 text-xs">
            <div class="${titleCls}">Structured Grants</div>
            <div class="grid grid-cols-2 gap-2">
              <label class="block space-y-1">Hit Die
                <select id="ed-hd" class="${inputCls}">
                  <option value="" ${!n.grants?.hitDie?'selected':''}>None</option>
                  <option value="8" ${n.grants?.hitDie===8?'selected':''}>d8</option>
                  <option value="10" ${n.grants?.hitDie===10?'selected':''}>d10</option>
                  <option value="12" ${n.grants?.hitDie===12?'selected':''}>d12</option>
                </select>
              </label>
              <label class="block space-y-1">Spell Tier
                <select id="ed-sp" class="${inputCls}">
                  ${SPELL_TIER_LABELS.map((l,i) => `<option value="${i}" ${(n.grants?.spellTier||0)===i?'selected':''}>${esc(l)}</option>`).join('')}
                </select>
              </label>
            </div>
            <div class="space-y-1"><div>Saving Throws</div><div class="flex flex-wrap gap-1">${ALL_SAVES.map((s) => `<label class="inline-flex items-center gap-1 px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] cursor-pointer"><input type="checkbox" data-gs="${s}" ${(n.grants?.saves||[]).includes(s)?'checked':''} />${s}</label>`).join('')}</div></div>
            <label class="block space-y-1">Skills (CSV) <input id="ed-sk" class="${inputCls}" value="${esc((n.grants?.skills||[]).join(', '))}" /></label>
            <label class="block space-y-1">Proficiencies (CSV) <input id="ed-pr" class="${inputCls}" value="${esc((n.grants?.proficiencies||[]).join(', '))}" /></label>
            <label class="block space-y-1">Tags (CSV) <input id="ed-tg" class="${inputCls}" value="${esc((n.grants?.tags||[]).join(', '))}" /></label>
          </div>

          <div class="${cardCls} space-y-2 text-xs">
            <div class="${titleCls}">Parent Links (${parents.length})</div>
            <div class="flex flex-wrap gap-1">${parents.length ? parents.map((p) => `<span class="${chipCls}"><span data-jump="${p.id}">${esc(p.name)}</span><button data-up="${p.id}" class="text-[var(--error)] font-bold ml-1 cursor-pointer">&times;</button></span>`).join('') : `<span class="text-[var(--muted-foreground)]">None</span>`}</div>
            <div class="flex gap-1.5">
              <select id="ed-ap-sel" class="${inputCls} flex-1"><option value="">+ Add parent...</option>${cands.map((c) => `<option value="${c.id}">${esc(c.name)} (T${c.tier})</option>`).join('')}</select>
              <button id="ed-ap-btn" class="px-2.5 rounded border border-[var(--border)] bg-[var(--card)] font-semibold cursor-pointer">Add</button>
            </div>
            <div class="${titleCls} pt-2">Children (${children.length})</div>
            <div class="flex flex-wrap gap-1">${children.length ? children.map((c) => `<span class="${chipCls}"><span data-jump="${c.id}">${esc(c.name)}</span><button data-uc="${c.id}" class="text-[var(--error)] font-bold ml-1 cursor-pointer">&times;</button></span>`).join('') : `<span class="text-[var(--muted-foreground)]">None</span>`}</div>
          </div>
        `;
        wireJumps();
        const mut = (fn, re = false) => { pushUndo(); fn(); saveTree(); renderCanvas(); if (re) renderInspector(); };
        const csv = (v) => v.split(',').map((s) => s.trim()).filter(Boolean);

        document.getElementById('e-child').addEventListener('click', () => createNewNode({ parentId: n.id }));
        document.getElementById('e-del').addEventListener('click', () => {
          pushUndo();
          state.data.nodes = state.data.nodes.filter((x) => x.id !== n.id);
          state.data.edges = state.data.edges.filter((e) => e.from !== n.id && e.to !== n.id);
          state.build.unlocked.delete(n.id);
          state.selectedNodeId = state.data.nodes[0]?.id || null;
          saveTree(); saveBuild(); renderAll(); showToast(`Deleted ${n.name}`);
        });
        document.getElementById('e-reset').addEventListener('click', resetDefaultTree);
        document.getElementById('ed-name').addEventListener('change', (e) => mut(() => { n.name = e.target.value.trim() || 'Untitled'; }));
        document.getElementById('ed-role').addEventListener('change', (e) => mut(() => { n.role = e.target.value; if (n.role === 'hybrid' && (n.secondaryRoles||[]).length < 2) n.secondaryRoles = ['combat','magic']; }, true));
        document.getElementById('ed-cat').addEventListener('change', (e) => mut(() => { n.category = e.target.value; }));
        document.getElementById('ed-tier').addEventListener('change', (e) => mut(() => { n.tier = Number(e.target.value); }));
        document.getElementById('ed-cost').addEventListener('change', (e) => mut(() => { n.cost = Math.max(0, Number(e.target.value) || 0); }));
        document.getElementById('ed-pm').addEventListener('change', (e) => mut(() => { n.prereqMode = e.target.value; }));
        document.getElementById('ed-src').addEventListener('change', (e) => mut(() => { n.source5e = e.target.value; }));
        document.getElementById('ed-sum').addEventListener('change', (e) => mut(() => { n.summary = e.target.value; }));
        document.getElementById('ed-mech').addEventListener('change', (e) => mut(() => { n.mechanics = e.target.value; }));
        inspectorContent.querySelectorAll('[data-sr]').forEach((cb) => cb.addEventListener('change', () => mut(() => { n.secondaryRoles = Array.from(inspectorContent.querySelectorAll('[data-sr]:checked')).map((x) => x.dataset.sr); })));
        document.getElementById('ed-hd').addEventListener('change', (e) => mut(() => { n.grants.hitDie = e.target.value ? Number(e.target.value) : null; }));
        document.getElementById('ed-sp').addEventListener('change', (e) => mut(() => { n.grants.spellTier = Number(e.target.value) || 0; }));
        inspectorContent.querySelectorAll('[data-gs]').forEach((cb) => cb.addEventListener('change', () => mut(() => { n.grants.saves = Array.from(inspectorContent.querySelectorAll('[data-gs]:checked')).map((x) => x.dataset.gs); })));

        document.getElementById('ed-tg').addEventListener('change', (e) => mut(() => { n.grants.tags = csv(e.target.value); }));
        document.getElementById('ed-ap-btn').addEventListener('click', () => {
          const pid = document.getElementById('ed-ap-sel').value;
          if (!pid || wouldCreateCycle(pid, n.id)) return;
          mut(() => state.data.edges.push({ id: `edge_${pid}__${n.id}_${Date.now()}`, from: pid, to: n.id }), true);
          showToast('Added parent link');
        });
        inspectorContent.querySelectorAll('[data-up]').forEach((b) => b.addEventListener('click', () => mut(() => { state.data.edges = state.data.edges.filter((e) => !(e.from === b.dataset.up && e.to === n.id)); }, true)));
        inspectorContent.querySelectorAll('[data-uc]').forEach((b) => b.addEventListener('click', () => mut(() => { state.data.edges = state.data.edges.filter((e) => !(e.from === n.id && e.to === b.dataset.uc)); }, true)));
      }

      function autoLayoutRadial() {
        pushUndo();
        const groups = new Map(ALL_ROLES_ORDER.map((r) => [r, [[],[],[],[],[]]]));
        for (const n of state.data.nodes) (groups.get(n.role) || groups.get('hybrid'))[Math.max(0, Math.min(4, Number(n.tier)||0))].push(n);
        const baseA = { combat: -90, devotion: -18, magic: 54, social: 126, exploring: 198 };
        const seamA = { 'combat+devotion': -54, 'devotion+magic': 18, 'magic+social': 90, 'exploring+social': 162, 'combat+exploring': -126 };
        for (const [rid, tiers] of groups.entries()) {
          if (rid === 'hybrid') continue;
          tiers.forEach((list, t) => {
            if (!list.length) return;
            const span = Math.min(48, Math.max(10, (list.length - 1) * 9.5));
            list.forEach((n, i) => {
              const off = list.length === 1 ? 0 : -span / 2 + (i / (list.length - 1)) * span;
              const rad = ((baseA[rid] + off) * Math.PI) / 180;
              n.x = Math.round(Math.cos(rad) * TIER_RADII[t]);
              n.y = Math.round(Math.sin(rad) * TIER_RADII[t]);
            });
          });
        }
        state.data.nodes.filter((n) => n.role === 'hybrid').forEach((n, i) => {
          const s = seamA[(n.secondaryRoles || []).slice(0, 2).sort().join('+')];
          const r = s !== undefined ? Math.max(600, TIER_RADII[n.tier] - 40) : 95 + (i % 3) * 45;
          const rad = ((s !== undefined ? s : i * 120) * Math.PI) / 180;
          n.x = Math.round(Math.cos(rad) * r); n.y = Math.round(Math.sin(rad) * r);
        });
        for (let k = 0; k < 100; k++) {
          let mv = false;
          for (let i = 0; i < state.data.nodes.length; i++) {
            for (let j = i + 1; j < state.data.nodes.length; j++) {
              const a = state.data.nodes[i], b = state.data.nodes[j];
              const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.1;
              if (d < 132) {
                const p = (132 - d) * 0.5;
                if (a.category !== 'root') { a.x -= (dx / d) * p; a.y -= (dy / d) * p; }
                if (b.category !== 'root') { b.x += (dx / d) * p; b.y += (dy / d) * p; }
                mv = true;
              }
            }
          }
          if (!mv) break;
        }
        for (const n of state.data.nodes) { n.x = Math.round(n.x); n.y = Math.round(n.y); }
        saveTree(); renderAll(); fitToNodes(); showToast('Radial layout updated');
      }

      function resetDefaultTree() {
        pushUndo();
        state.data = deepClone(window.FIVEFOLD_DEFAULT_TREE);
        state.selectedNodeId = 'combat_root';
        pruneInvalidBuildNodes(); saveTree(); renderAll(); fitToNodes();
        showToast('Restored default Fivefold 5e skill web');
      }

      function setMode(mode) {
        state.mode = mode;
        if (mode !== 'edit') { state.linkMode = false; state.linkSourceId = null; svg.classList.remove('linking'); setStatus(''); }
        document.querySelectorAll('.mode-btn').forEach((b) => {
          const act = b.dataset.mode === mode;
          b.className = `mode-btn px-3 py-1 rounded-md text-xs font-semibold cursor-pointer transition ${act ? 'bg-[var(--card)] text-[var(--foreground)] shadow-sm' : 'text-[var(--muted-foreground)]'}`;
          b.setAttribute('aria-selected', String(act));
        });
        editCanvasToolsEl.classList.toggle('hidden', mode !== 'edit');
        editCanvasToolsEl.classList.toggle('flex', mode === 'edit');
        renderAll();
      }

      function downloadText(name, content, mime = 'application/json') {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }

      let toastTimer = null;
      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('visible'), 2500);
      }

      function renderSearch() {
        const q = state.searchQuery.trim();
        searchClear.classList.toggle('hidden', !q);
        if (!q) { searchResults.classList.add('hidden'); return; }
        const hits = state.data.nodes.filter(isNodeMatching).slice(0, 12);
        searchResults.innerHTML = hits.length
          ? hits.map((n) => `<button data-pick="${n.id}" class="w-full text-left px-2.5 py-2 flex items-center justify-between gap-2 hover:bg-[var(--secondary)] border-b border-[var(--border)] last:border-b-0 cursor-pointer text-xs">
              <span class="flex items-center gap-1.5 font-semibold"><span class="w-2 h-2 rounded-full" style="background:${getRoleInfo(n.role).color}"></span>${esc(n.name)}</span>
              <span class="font-mono text-[var(--muted-foreground)]">T${n.tier} · ${n.cost}SP</span>
            </button>`).join('')
          : `<div class="p-2.5 text-xs text-[var(--muted-foreground)]">No matches</div>`;
        searchResults.classList.remove('hidden');
        searchResults.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => {
          state.selectedNodeId = b.dataset.pick;
          searchResults.classList.add('hidden');
          panToNode(state.selectedNodeId, 1.55);
          renderAll();
        }));
      }

      function renderAll() { renderRolePills(); renderCanvas(); renderInspector(); updateUndoButtons(); }

      // Event wiring
      document.querySelectorAll('.mode-btn').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      buildSubtabs.querySelectorAll('.sub-tab').forEach((b) => b.addEventListener('click', () => { state.buildSubTab = b.dataset.btab; renderInspector(); }));
      document.getElementById('filter-category').addEventListener('change', (e) => { state.filterCategory = e.target.value; renderCanvas(); });
      document.getElementById('filter-tier').addEventListener('change', (e) => { state.filterTier = e.target.value; renderCanvas(); });
      searchInput.addEventListener('input', (e) => { state.searchQuery = e.target.value; renderCanvas(); renderSearch(); });
      searchClear.addEventListener('click', () => { state.searchQuery = ''; searchInput.value = ''; renderCanvas(); renderSearch(); });
      document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) searchResults.classList.add('hidden'); });
      document.getElementById('btn-zoom-in').addEventListener('click', () => zoomBy(1.25));
      document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(0.8));
      document.getElementById('btn-fit').addEventListener('click', () => fitToNodes());
      document.getElementById('btn-rings').addEventListener('click', (e) => {
        state.showRings = !state.showRings;
        e.currentTarget.className = state.showRings
          ? 'h-7 px-2.5 rounded border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-medium cursor-pointer'
          : 'h-7 px-2.5 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer';
        renderGuides();
      });
      document.getElementById('btn-add-node').addEventListener('click', () => createNewNode({ parentId: getNode(state.selectedNodeId)?.id || null }));
      document.getElementById('btn-link-mode').addEventListener('click', (e) => {
        state.linkMode = !state.linkMode; state.linkSourceId = null;
        svg.classList.toggle('linking', state.linkMode);
        e.currentTarget.className = state.linkMode
          ? 'h-7 px-2.5 rounded border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer'
          : 'h-7 px-2.5 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer';
        setStatus(state.linkMode ? 'Link Mode: click parent node, then child node' : '');
        renderCanvas();
      });
      document.getElementById('hud-status-cancel').addEventListener('click', () => {
        state.linkMode = false; state.linkSourceId = null; svg.classList.remove('linking'); setStatus('');
        document.getElementById('btn-link-mode').className = 'h-7 px-2.5 rounded border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-medium cursor-pointer';
        renderCanvas();
      });
      document.getElementById('btn-auto-layout').addEventListener('click', autoLayoutRadial);
      document.getElementById('btn-undo').addEventListener('click', performUndo);
      document.getElementById('btn-redo').addEventListener('click', performRedo);
      document.getElementById('btn-export').addEventListener('click', () => { downloadText('fivefold5e-skill-tree.json', JSON.stringify(state.data, null, 2)); showToast('Exported JSON'); });
      const fi = document.getElementById('file-import');
      document.getElementById('btn-import').addEventListener('click', () => fi.click());
      fi.addEventListener('change', (e) => {
        const f = e.target.files?.[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const p = JSON.parse(String(r.result));
            if (!Array.isArray(p.nodes) || !Array.isArray(p.edges)) throw new Error('Invalid tree JSON');
            pushUndo(); state.data = { ...deepClone(window.FIVEFOLD_DEFAULT_TREE), ...p };
            state.selectedNodeId = state.data.nodes[0]?.id || null;
            pruneInvalidBuildNodes(); saveTree(); renderAll(); fitToNodes();
            showToast(`Imported ${state.data.nodes.length} nodes`);
          } catch (err) { showToast(`Import failed: ${err.message}`); }
          fi.value = '';
        };
        r.readAsText(f);
      });

      window.addEventListener('keydown', (e) => {
        if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? performRedo() : performUndo(); }
        else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); performRedo(); }
      });
      window.addEventListener('themechange', renderCanvas);

      renderAll();
      fitToNodes();
    })();
  </script>
</body>
</html>
